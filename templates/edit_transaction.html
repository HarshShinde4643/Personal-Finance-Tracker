
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
            Personal Finance Tracker
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">

            <h3 class="mb-4">Edit Transaction</h3>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Transaction Type</label>

                    <select name="transaction_type" class="form-select" required>
                        <option value="income"
                            {% if transaction.transaction_type == 'income' %}selected{% endif %}>
                            Income
                        </option>

                        <option value="expense"
                            {% if transaction.transaction_type == 'expense' %}selected{% endif %}>
                            Expense
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <input type="text"
                           name="category_name"
                           class="form-control"
                           value="{{ transaction.category_name or '' }}"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (₹)</label>

                    <input type="number"
                           name="amount"
                           class="form-control"
                           value="{{ transaction.amount }}"
                           min="0.01"
                           max="99999999.99"
                           step="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Transaction Date</label>

                    <input type="date"
                           name="transaction_date"
                           class="form-control"
                           value="{{ transaction.transaction_date }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              maxlength="255"
                              rows="3">{{ transaction.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Update Transaction
                </button>

                <a href="{{ url_for('transactions') }}"
                   class="btn btn-outline-secondary w-100 mt-2">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
